<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket - Contacto</title>
    <link rel="stylesheet" href="../Css/main.css">
    <link rel="stylesheet" href="../Css/layout.css">
    <link rel="stylesheet" href="../Css/components.css">
    <link rel="stylesheet" href="../Css/animations.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <h1>EcoMarket</h1>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="products.html">Productos</a></li>
                <li><a href="sobre-nosotros.html">Sobre Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>

            </ul>
        </nav>
        <div class="header-actions"></div>
    </header>

    <main class="main-content contact-layout">
        <section class="contact-form-card">
            <h2>Contacts</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Escribe tu nombre..." required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" class="form-input form-textarea" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Enviar</button>
            </form>
        </section>

        <aside class="contact-info-sidebar">
            <div class="info-card">
                <h3>Call us</h3>
                <p class="info-highlight">+300 123 4567</p>
            </div>
            <div class="info-card">
                <h3>Email us</h3>
                <p class="info-highlight">@ecomarket</p>
            </div>
        </aside>
    </main>
</body>
</html>
